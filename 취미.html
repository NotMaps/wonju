<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>박재민의 취미</title>

<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">


<style>

* {
    box-sizing:border-box;
}


body {

    width:700px;
    margin:0 auto;
    background:#eeeeee;
    font-family:"Jua", sans-serif;
    color:#333;

}



#container {

    width:700px;
    margin:30px auto;
    padding:25px;

    background:#d3d3d3;

    border-radius:30px;

    box-shadow:0 0 20px gray;

}



h1 {

    text-align:center;
    color:#444;

}



h2 {

    background:gold;

    padding:10px 20px;

    border-radius:20px;

}



section {

    background:white;

    padding:20px;

    margin:25px 0;

    border-radius:25px;

    box-shadow:0 5px 15px gray;

}



ul {

    padding:0;

}



li {

    list-style:none;

    background:#3498db;

    color:white;

    padding:12px 20px;

    margin:10px;

    border-radius:20px;

    transition:0.3s;

}



li:hover {

    background:#8e44ad;

    transform:scale(1.05);

}



button {

    display:block;

    margin:20px auto;

    background:#3498db;

    color:white;

    border:none;

    padding:15px 30px;

    border-radius:30px;

    font-family:"Jua";

    font-size:18px;

}



button:hover {

    background:purple;

}



a {

    text-decoration:none;

    color:white;

}



</style>

</head>



<body>


<div id="container">


<h1>🎮 취미 생활 🎨</h1>



<a href="https://notmaps.github.io/wonju">

<button>
⬅ 원래 포트폴리오로 돌아가기
</button>

</a>




<section>


<h2>🎮 게임</h2>


<ul>


<li>
리그 오브 레전드
</li>


<li>
언더테일 (UNDERTALE)
</li>


<li>
델타룬 (deltarune)
</li>


<li>
마인크래프트
</li>


<li>
슈타인즈 게이트
</li>


</ul>


</section>





<section>


<h2>📺 애니 보기</h2>


<ul>


<li>
죠죠의 기묘한 모험
</li>


<li>
블리치
</li>


<li>
원피스
</li>


<li>
강철의 연금술사
</li>


<li>
슈타인즈 게이트
</li>


</ul>


</section>






<section>


<h2>🧸 피규어 모으기</h2>


<ul>


<li>
이치방쿠지
</li>


<li>
반프레스토
</li>


<li>
애니메이션 캐릭터 피규어 수집
</li>



</ul>


</section>






<section>


<h2>🎨 그림 그리기</h2>


<ul>


<li>
좋아하는 캐릭터 그리기
</li>






<li>
그림 실력 향상하기
</li>


</ul>


</section>



</div>


</body>

</html>
