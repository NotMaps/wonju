<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>20611 박재민 전투력</title>

<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">


<style>

* {
    box-sizing:border-box;
}


body {
    width:700px;
    margin:0 auto;
    background:#eeeeee;
    font-family:"Jua", sans-serif;
    color:#333;
}



#container {

    width:700px;
    margin:30px auto;

    background:#dcdcdc;

    padding:25px;

    border-radius:30px;

    box-shadow:0 0 20px gray;

}



h1 {

    text-align:center;

    color:#444;

}



h2 {

    background:gold;

    padding:10px 20px;

    border-radius:20px;

}



h3 {

    color:#555;

}



/* 카드 */

section {

    background:white;

    padding:20px;

    margin:25px 0;

    border-radius:25px;

    box-shadow:0 5px 10px #aaa;

}




/* 표 */

table {

    width:80%;

    margin:20px auto;

    border-collapse:collapse;

    background:white;

    border-radius:20px;

    overflow:hidden;

}



td {

    padding:12px;

    border-bottom:1px solid #ddd;

    text-align:center;

}



td:first-child {

    background:#ffe680;

    font-weight:bold;

    width:40%;

}



tr:hover {

    background:#f5f5f5;

}



/* 스탯 */

.stat td:nth-child(2) {

    font-size:20px;

    color:#e74c3c;

    font-weight:bold;

}



/* 이미지 */

img {

    display:block;

    margin:20px auto;

    max-width:90%;

    border-radius:30px;

    box-shadow:0 5px 10px gray;

}



</style>


</head>


<body>


<div id="container">


<h1>
⚔️ 20611 박재민의 전투력 ⚔️
</h1>





<section id="stat">


<h2>🔥 스탯</h2>


<table class="stat">


<tr>
<td>체력</td>
<td>60</td>
</tr>


<tr>
<td>공격력</td>
<td>40</td>
</tr>


<tr>
<td>방어력</td>
<td>80</td>
</tr>


<tr>
<td>기동력</td>
<td>10</td>
</tr>


<tr>
<td>귀도</td>
<td>60</td>
</tr>


<tr>
<td>지력</td>
<td>80</td>
</tr>


</table>


</section>







<section>


<h2>🌊 사용가능한 귀도</h2>


<h3>파도 90 : 흑관</h3>


<img src="media/흑관.jpg" alt="흑관">


</section>







<section>


<h2>⭐ 스탠드</h2>


<h3>킬러퀸</h3>


<img src="media/kira.png" alt="킬러퀸">


</section>





</div>


</body>

</html>
